# JVM needs room for Kotlin compilation and the R8/D8 run on CI.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true

# The app is fully offline: Compose, Kotlin and PdfBox-Android are the only
# dependencies, and all of them are released on stable channels.
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# 16 KB page alignment: everything native is built for 16 KB ELF alignment and
# verified in CI (see .github/workflows/android.yml).
android.defaults.buildfeatures.resvalues=false

# Device targeting for the llm_pack (>= 6 GB RAM) is still an experimental
# API in AGP; the wiring in :app bundle block needs this flag until it
# stabilizes.
android.experimental.enableDeviceTargetingConfigApi=true
