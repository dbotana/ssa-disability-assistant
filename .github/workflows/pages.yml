name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `|| exit 1` matters: a bare for-loop's status is only its last test's.
      - name: Run tests
        run: for t in tests/*.js; do node "$t" || exit 1; done

      - uses: actions/configure-pages@v5

      # The site is plain static files — no build step. Upload the repo root,
      # minus things that should not be published. forms/ is published: the
      # official PDFs are the templates the app fills in.
      - name: Stage site
        run: |
          mkdir _site
          rsync -a --exclude '.git*' --exclude '_site' \
                --exclude 'tests' --exclude 'tools' --exclude '*.md' \
                --exclude 'start-*' \
                --exclude 'ai-product-milestone-1-package' ./ _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
